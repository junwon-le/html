<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Input Field Example</title>
<!-- jQuery CDN 시작 -->
<script
	src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<style>
/* ... (이전 CSS 코드는 유지) ... */

/* 상세 내용 컨테이너 (기본적으로 숨김) */
.agreement-detail {
    /* 기본적으로 숨기기 */
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.3s ease-out; /* 부드러운 애니메이션 효과 */
}

/* 상세 내용이 보일 때 */
.agreement-detail.is-open {
    /* 실제 내용 높이에 맞춰 적절히 크게 설정 */
    max-height: 300px; 
    transition: max-height 0.3s ease-in;
}

/* 상세 내용 박스 스타일 */
.detail-box {
    background-color: #f7f7f7;
    border: 1px solid #eee;
    padding: 15px;
    margin: 10px 0;
    border-radius: 5px;
}

.detail-box h4 {
    margin-top: 0;
    font-size: 1em;
    color: #333;
    border-bottom: 1px solid #ddd;
    padding-bottom: 5px;
    margin-bottom: 10px;
}

.detail-box p {
    margin: 3px 0;
    font-size: 0.95em;
    color: #555;
}

/* 화살표 아이콘 스타일 */
.detail-arrow {
    font-size: 1.2em;
    color: #aaa;
    margin-left: 10px;
    cursor: pointer;
    /* 화살표 회전을 위한 전환 효과 */
    transition: transform 0.3s; 
}

/* 화살표가 아래로 돌아가도록 설정 (내용이 열렸을 때) */
.detail-arrow.rotated {
    transform: rotate(90deg);
}

/* 항목 전체를 클릭했을 때 커서 변경 */
.agreement-item {
    cursor: pointer;
}
</style>
<script>
$(document).ready(function() {
    // 1. 항목 전체를 클릭하면 상세 내용 토글
    $("#agreementItem1").click(function(e) {
        // 체크박스 클릭 이벤트는 제외하고 상세 내용 토글
        if (!$(e.target).is('input[type="checkbox"]')) {
            // 상세 내용 div와 화살표를 선택
            var $detail = $("#detailContent1");
            var $arrow = $(this).find('.detail-arrow');

            // 내용 토글
            $detail.toggleClass('is-open');
            // 화살표 회전 토글
            $arrow.toggleClass('rotated');
        }
    });
    
    // 2. 화살표 버튼만 클릭해도 상세 내용 토글 (선택 사항)
    $(".toggle-btn").click(function(e) {
        e.stopPropagation(); // 중복 이벤트 방지
        var $item = $(this).closest('.agreement-item');
        var itemId = $item.attr('id');
        
        var $detail = $("#" + itemId.replace("Item", "Content"));
        var $arrow = $(this);

        // 내용 토글
        $detail.toggleClass('is-open');
        // 화살표 회전 토글
        $arrow.toggleClass('rotated');
    });
});
</script>
</head>
<body>
<div class="agreement-section">
    <h2 class="section-title">약관 동의</h2>

    <hr class="section-divider">

    <div class="agreement-item" id="agreementItem1">
        <label class="agreement-label">
            <input type="checkbox" name="privacy_agree" required>
            <span class="agreement-text">
                <span class="required-tag">[필수]</span> 개인 정보 수집 및 이용 동의
            </span>
        </label>
        
        <span class="detail-arrow toggle-btn">&gt;</span>
    </div>

    <div class="agreement-detail" id="detailContent1">
        <div class="detail-box">
            <h4>개인정보 수집 및 이용 동의 상세 내용</h4>
            <p>1. 수집 목적: 서비스 이용자 식별 및 회원 관리</p>
            <p>2. 수집 항목: 이름, 연락처, 이메일 주소</p>
            <p>3. 보유 및 이용 기간: 회원 탈퇴 시 또는 법정 보존 기한까지</p>
            <p style="margin-top: 10px; font-size: 0.9em; color: #888;">
                **[주의]** 위 사항에 동의하지 않을 경우, 서비스 이용이 제한될 수 있습니다.
            </p>
        </div>
    </div>

    <hr class="item-divider">
</div>
</body>
</html>
