<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>공지사항</title>
    <style type="text/css">
/* 폰트 및 기본 설정 */
/* ---------------------------------------------------- */
body {
    font-family: 'Noto Sans KR', sans-serif;
    margin: 0;
    background-color: #fff;
    color: #333;
}
.wrap {
    max-width: 1000px; /* 전체 컨테이너 너비 조정 */
    margin: 0 auto;
    padding: 0 20px 50px 20px;
}
* {
    box-sizing: border-box;
}

/* ---------------------------------------------------- */
/* 1. 상단 메뉴 */
/* ---------------------------------------------------- */
.page-header {
    display: flex;
    justify-content: flex-start;
    gap: 20px;
    padding: 30px 0 0 0; /* 상단 여백 조정 */
    font-size: 15px;
    color: #888;
}

.header-link {
    cursor: pointer;
}

.header-link:last-child {
    font-weight: 500;
    color: #333;
}

.header-link span {
    font-size: 10px;
    margin-left: 5px;
    vertical-align: middle;
}

/* ---------------------------------------------------- */
/* 2. 제목 */
/* ---------------------------------------------------- */
h1 {
    font-size: 32px;
    font-weight: 700;
    text-align: center;
    margin: 40px 0 30px 0;
}

/* ---------------------------------------------------- */
/* 3. 상단 카드 영역 */
/* ---------------------------------------------------- */
.top-announcement-card {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    height: 200px;
    padding: 30px;
    margin-bottom: 50px;
    border-radius: 20px;
    background-color: #f8f8f8;
    position: relative;
    overflow: hidden;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05); /* 은은한 그림자 */
}

/* 카드 배경 디자인 (핑크색 그라데이션) */
.top-announcement-card::before {
    content: '';
    position: absolute;
    top: -50px;
    left: -50px;
    width: 200px;
    height: 200px;
    border-radius: 50%;
    background: radial-gradient(circle, #ffebeb 0%, #ffffff 70%);
}

.card-content {
    z-index: 1;
}

.card-content h2 {
    font-size: 20px;
    font-weight: 500;
    margin-bottom: 30px;
}

.pagination {
    display: flex;
    gap: 8px;
}

.dot {
    display: block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background-color: #ddd;
    opacity: 0.7;
}

.dot.active {
    width: 25px;
    border-radius: 4px;
    background-color: #999;
}

.card-image {
    width: 150px;
    height: 150px;
    border-radius: 50%;
    background-color: #f1f1f1;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 1;
}

.magnifying-glass-image {
    /* 실제 이미지가 들어갈 자리 */
    width: 100px;
    height: 100px;
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 50%;
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
}

/* ---------------------------------------------------- */
/* 4. 검색 및 필터 영역 */
/* ---------------------------------------------------- */
.search-filter-section {
    display: flex;
    justify-content: space-between;
    gap: 20px;
    margin-bottom: 40px;
}

.filter-dropdown {
    width: 150px;
    position: relative;
    border: 1px solid #ddd;
    border-radius: 8px;
    height: 40px;
}

.filter-dropdown select {
    width: 100%;
    height: 100%;
    padding: 0 15px;
    border: none;
    border-radius: 8px;
    appearance: none; /* 기본 드롭다운 스타일 제거 */
    -webkit-appearance: none;
    -moz-appearance: none;
    background-color: transparent;
    cursor: pointer;
    font-size: 14px;
}

.filter-dropdown::after {
    content: 'v'; /* 드롭다운 화살표 대체 */
    position: absolute;
    top: 50%;
    right: 15px;
    transform: translateY(-50%) scaleX(0.7);
    color: #888;
    pointer-events: none;
}

.search-box {
    flex-grow: 1;
    display: flex;
    border: 1px solid #ddd;
    border-radius: 8px;
    height: 40px;
    padding: 0 15px;
}

.search-box input {
    flex-grow: 1;
    border: none;
    outline: none;
    padding: 0;
    font-size: 14px;
}

.search-box .search-icon {
    background: none;
    border: none;
    cursor: pointer;
    font-size: 18px;
    color: #888;
}

/* ---------------------------------------------------- */
/* 5. 공지 목록 테이블 */
/* ---------------------------------------------------- */
.notice-list-section {
    border-top: 2px solid #333;
    border-bottom: 1px solid #eee;
}

.notice-list {
    list-style: none;
    padding: 0;
    margin: 0;
}

.notice-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 18px 0;
    border-bottom: 1px solid #eee;
    font-size: 15px;
}

/* 마지막 요소는 테두리를 제거하거나, 전체 섹션 테두리가 덮도록 설정 */
.notice-item:last-child {
    border-bottom: none;
}

/* 공지 유형 태그 */
.notice-item .tag {
    flex-basis: 50px; /* 태그 너비 고정 */
    font-weight: 500;
    color: #6a35ff; /* 이미지와 유사한 보라색 */
    margin-right: 10px;
    text-align: center;
}

/* 이벤트 태그 색상 */
.notice-item .tag.event {
    color: #ff5a4a; /* 빨간색 계열 */
}

/* 제목 */
.notice-item .title {
    flex-grow: 1;
    color: #333;
    padding-left: 20px;
    border-left: 1px solid #eee;
}

/* 날짜 */
.notice-item .date {
    flex-basis: 100px; /* 날짜 너비 고정 */
    color: #888;
    font-size: 14px;
    text-align: right;
}

/* 임시 placeholder 요소 숨기기 */
.notice-item.placeholder {
    height: 35px; /* 빈 공간처럼 보이게 높이만 유지 */
    border-bottom: none;
}

.notice-item.placeholder * {
    visibility: hidden;
}

/* ---------------------------------------------------- */
/* 맨 위로 버튼 */
/* ---------------------------------------------------- */
.to-top-button {
    position: fixed;
    bottom: 30px;
    right: 30px;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background-color: #fff;
    border: 1px solid #ddd;
    color: #6a35ff;
    font-size: 20px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
}

    </style>
    </head>
<body>

    <header class="header-menu">
        <div class="dropdown-menu">소통서비스</div>
        <div class="dropdown-menu">공지사항</div>
    </header>

    <main class="main-content">
        <h1>공지사항</h1>

        <section class="top-card-section">
            <div class="card-container">
                <div class="card-content">
                    <h2>입장 전 소지품 검사 안내</h2>
                    </div>
                <div class="card-image-placeholder">
                                    </div>
                <div class="dot-pagination">
                    <span class="dot active"></span>
                    <span class="dot"></span>
                    <span class="dot"></span>
                </div>
            </div>
        </section>

        <section class="search-filter-area">
            <div class="filter-group">
                <div class="dropdown-type">
                    <select name="notice-type" id="notice-type">
                        <option value="전체">전체</option>
                        </select>
                </div>
                <div class="search-input">
                    <input type="text" placeholder="키워드를 입력해 주세요.">
                    <button class="search-button">
                        </button>
                </div>
            </div>
        </section>

        <section class="notice-list-area">
            <div class="list-header">
                <div class="col-sort-type">제목</div>
                <div class="col-sort-date">날짜</div>
            </div>

            <ul class="notice-items">
                <li class="notice-item">
                    <span class="type">공지</span>
                    <span class="title">9월 25일 웹사이트 홈페이지 리뉴얼 오픈</span>
                    <span class="date">2025.09.10</span>
                </li>
                <li class="notice-item">
                    <span class="type">이벤트</span>
                    <span class="title">할로윈 이벤트, 이용에 제한이 있을 수 있습니다.</span>
                    <span class="date">2025.09.10</span>
                </li>
                <li class="notice-item">
                    <span class="type">공지</span>
                    <span class="title">연간이용권 이용약관 개정 안내</span>
                    <span class="date">2025.09.10</span>
                </li>
                 <li class="notice-item">
                    <span class="type">공지</span>
                    <span class="title">온라인 예매 유의사항 안내</span>
                    <span class="date">2025.08.11</span>
                </li>
                 <li class="notice-item">
                    <span class="type">공지</span>
                    <span class="title">2025 콘텐츠 디자인 공모전 안내</span>
                    <span class="date">2025.08.05</span>
                </li>
                 <li class="notice-item">
                    <span class="type">공지</span>
                    <span class="title">어트랙션 정기점검 및 운휴 안내</span>
                    <span class="date">2025.07.13</span>
                </li>
                
                </ul>
        </section>
        
        </main>
</body>
</html>
