<!DOCTYPE html>
<html>
<head>
<link rel="shortcut icon"	href="http://192.168.10.73/html_prj/common/images/favicon.ico">
<meta charset=UTF-8>
<title>Insert title here</title>
<!-- bootstrap CDN 시작 -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<!-- bootstrap CDN 끝 -->
<style type="text/css">
#wrap{ margin : 0px auto ; width : 1200px; height : 1000px;
      /* background-color: #ff0000 */ }
#header{ height : 150px;  /* background-color: #4179C2 */ }
#container{ height : 700px;  /* background-color: #71b75e ; */ }
#footer{ height : 150px;  /* background-color: #fef6e1 ; */ }
.chk{width : 20px ; height :20px;}
</style>

<!-- jQuery DNS 시작 -->
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<script type="text/javascript">
$(function(){
	$("#btn").click(chkVal);
	$("#btn2").click(chkVal2);
	$("#btn3").click(useArr);
	$("#btn5").click(useArr2); // ready시에는 btn5 없었음==> 이벤트 처리 x

});//ready
//태그를 찾고 바로 반복
function chkVal(){
	var output="";
	var cnt =0;
	$(".chk:checked").each(function(i,chk){
		output+= $(chk).val()+" ";
		cnt=i;
	}); //each
	
	//관심언어는 3개까지만 선택할 수 있도록 사용자에게 alert로 안내
	if($(".chk:checked").length>3){
		alert("3개 까지만 가능합니다.")
	}
	$("#output").html(output);
	$("#output").html(output);
}//chkVal

//태그를 찾은 후 반복
function chkVal2(){
	var chkArr= $(".chk:checked"); //checked 속성인 태그만 얻어와서

	var output="";
	//each를 서서 반복
	$.each(chkArr,function(i,ele){
		output+= `<input type="text" name="selLang" class="selLang" value="${$(ele).val()}"/><br>`;
	});
	output += "<input type='button' value='값전송' class='btn btn-success' onclick='useArr2()' />"
	//ready시에는 btn5가 없음 => 이벤트 처리 x => inline으로 처리 ( onxxxx 속성 사용)
	$("#output").html(output);
}//chkVal

function useArr(){
	var arr=['Java', 'Oracle','JDBC','HTML','CSS']
	//for(var i=0;i<arr.length; i++){
//		i+" "+arr[i]
//	}
	$.each(arr, function(i,ele){
		alert(i+"번째 방에는"+ele+"가 있음");
	});
}
function useArr2(){
	var langArr = $(".selLang")	
  $.each(langArr, function(i,ele){
		alert($(ele).val());
	});
}
</script>
</head>
<body>
<div id = "wrap" >
	<div id="header">header 1200(w)x150(h) 
				사이트로고, 주력 서비스, navigation bar
	</div>
	<div id="container">
	<div>
		<label>관심언어 : </label >
		<input type="checkbox" name="lang" class="chk" value="Java"/>Java 
		<input type="checkbox" name="lang" class="chk" value="C/C++"/>C/C++ 
		<input type="checkbox" name="lang" class="chk" value="PyThon"/>PyThon 
		<input type="checkbox" name="lang" class="chk" value="JavaScript"/>JavaScript 
		<input type="checkbox" name="lang" class="chk" value="Go"/>Go Lang 
		<input type="checkbox" name="lang" class="chk" value="도"/>도<br >
		<input type="button" value="태그 자체를 반복" class="btn btn-success" id="btn"/><br>
		<input type="button" value="태그와 반복을 분리" class="btn btn-success" id="btn2"/><br>
		<input type="button" value="배열 반복" class="btn btn-success" id="btn3"/><br>
		<div id="output"></div>
	</div>
	</div>
	<div id="footer">footer 1200(w)x150(h)</div>
</div>

</body>
</html>
