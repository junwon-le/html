<!DOCTYPE html>
<html>
<head>
<link rel="shortcut icon"	href="http://192.168.10.73/html_prj/common/images/favicon.ico">
<meta charset=UTF-8>
<title>Insert title here</title>
<!-- bootstrap CDN 시작 -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

<!-- bootstrap CDN 끝 -->
<style type="text/css">
#wrap{ margin : 0px auto ; width : 1200px; height : 1000px;
      /* background-color: #ff0000 */ }
#header{ height : 150px;  /* background-color: #4179C2 */ }
#container{ height : 700px;  /* background-color: #71b75e ; */ }
#footer{ height : 150px;  /* background-color: #fef6e1 ; */ }
.chk{width : 20px ; height :20px;}
</style>

<!-- jQuery DNS 시작 -->
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<script type="text/javascript">
$(function(){
	$("#btn").click(chkVal);

});//ready

function chkVal(){
//	var chkArr = $(".chk");
	var chkArr = $(".chk:checked"); //checked 속성인 태그만 얻어와서
	
	var output="";
	for(var i=0;i<chkArr.length; i++){
		output+= $(chkArr[i]).val()+ " "
			}
//	for(var i=0;i<chkArr.length; i++){
//		if($(chkArr[i]).is(":checked")){
//			output += $(chkArr[i]).val()+ " ";
//		}//end if
//	}//end for
	
	$("#output").html(output);
}//chkVal
</script>

<body>
<div id = "wrap" >
	<div id="header">header 1200(w)x150(h) 
				사이트로고, 주력 서비스, navigation bar
	</div>
	<div id="container">
	<div>
		<label>관심언어 : </label >
		<input type="checkbox" name="lang" class="chk" value="Java"/>Java 
		<input type="checkbox" name="lang" class="chk" value="C/C++"/>C/C++ 
		<input type="checkbox" name="lang" class="chk" value="PyThon"/>PyThon 
		<input type="checkbox" name="lang" class="chk" value="JavaScript"/>JavaScript 
		<input type="checkbox" name="lang" class="chk" value="Go"/>Go Lang 
		<input type="checkbox" name="lang" class="chk" value="도"/>도<br >
		<input type="button" value="확인 값 얻기" class="btn btn-success" id="btn"/><br>
		<div id="output"></div>
	</div>
	</div>
	<div id="footer">footer 1200(w)x150(h)</div>
</div>
