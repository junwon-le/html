//onclick으로 호출하면 1. <body>가 로딩 되고, 2. 함수가 호출되므로 $(function(){})을 사용하지 않아도 된다.  
function useHTML(){
	var msg = " 내일은 <strong>수능일</strong> 입니다."
	$("#output").html(msg);
}//useHTML

function useText(){
	var msg = " 내일은 <strong>수능일</strong> 입니다."
	$("#output").text(msg);
	
}//useText

	<div>
		<input type="button" value="HTML출력" class="btn btn-success" onclick="useHTML()"/>
		<input type="button" value="TEXT출력" class="btn btn-info" onclick="useText()"/>
