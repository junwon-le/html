<!DOCTYPE html>
<html>
<head>
<link rel="shortcut icon"	href="http://192.168.10.73/html_prj/common/images/favicon.ico">
<meta charset="UTF-8">
<title>Insert title here</title>
<!-- bootstrap CDN 시작 -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<!-- bootstrap CDN 끝 -->
<style type="text/css">
#wrap{ margin : 0px auto ; width : 1200px; height : 1000px;
      /* background-color: #ff0000 */ }
#header{ height : 150px;  /* background-color: #4179C2 */ }
#container{ height : 700px;  /* background-color: #71b75e ; */ }
#footer{ height : 150px;  /* background-color: #fef6e1 ; */ }


</style>
<script type="text/javascript">
window.onload=function(){
	//복합 형태의 JSON : 데이터(JSONArray)와 데이터에 대한 정보 (JSONObject)
	var jsonArrStu=[];
	if(parseInt(Math.random()*2)==1){ // 검색된 데이터가 존재하는 경우 (java에서 넘어올 것 JSONSimple library) 
		jsonArrStu=[
			{name : "민병조", email : "min@test.com"},
			{name : "신승덕", email : "shin@test.com"},
			{email : "woo@google.com",name : "임성우"},
			{name : "이정우", email : "lee@daum.com"},
			{name : "이지원", email : "lee2@nate.com"},
			]
	}//end if
	 var jsonObj = {
					 classType : "2",
					 pubDate : new Date(),
					 dataLength	: jsonArrStu.length,
					 dataResult	: jsonArrStu.length!=0,
					 data: jsonArrStu
					 };
	
	//alert(jsonObj.dataLength);
	
	//data를 parsing
	var output =`<strong>${jsonObj.classType}</strong>강의장 학생 정보<br>
				 <strong>데이터 생산일</strong> : ${jsonObj.pubDate}<br>
				 <strong>조회 건수</strong> : ${jsonObj.dataLength}<br>
				 <table class="table table-hover">
				 <thead>
				 <tr>
				 <th style='width : 80px'>번호</th>
				 <th style='width : 120px'>이름</th>
				 <th style='width : 250px'>이메일</th>
				 </tr>
				 </thead>
				 <tbody>
				 `;
	if(!jsonObj.dataResult){//데이터가 존재하지 않는 경우
		output +=`<tr><td colspan ='3' style="textaling : center">
				  학생정보가 존재하지 않습니다.
				  </td></tr>
				 `;
	}//end if
	var jsonTempStu;
	for(var i =0 ; i<jsonObj.dataLength; i++ ){
		jsonTempStu = jsonObj.data[i];
		output += `<tr><td>${i+1}</td>
					<td>${jsonTempStu.name}</td>
					<td>${jsonTempStu.email}</td>
					`;		
	}//end for
	output+= `</tbody>
	</table>`;
	
	document.getElementById("output").innerHTML = output;
	
}
</script>
</head>
<body>
<div id = "wrap" >
	<div id="header">header 1200(w)x150(h) 
				사이트로고, 주력 서비스, navigation bar
	</div>
	<div id="container">
	<div id="output">
		
	</div>
	</div>
	<div id="footer">footer 1200(w)x150(h)</div>
</div>

</body>
