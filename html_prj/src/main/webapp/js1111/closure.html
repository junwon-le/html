<html>
<head>

<title>Insert title here</title>
<!-- bootstrap CDN 시작 -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

<!-- bootstrap CDN 끝 -->
<style type="text/css">
#wrap{ margin : 0px auto ; width : 1200px; height : 1000px;
      /* background-color: #ff0000 */ }
#header{ height : 150px;  /* background-color: #4179C2 */ }
#container{ height : 700px;  /* background-color: #71b75e ; */ }
#footer{ height : 150px;  /* background-color: #fef6e1 ; */ }
</style>
<script type="text/javascript">
window.onload=function(){
	//()를 사용한 closure
	//1. 선언
	var clo=({
				name : "민병조", age:"22",
				hellMsg : function( to ){
							//alert(to+"님 어서오고!");
							return to+"님 어서오고!";
							}
			});
	//2. 사용(parsing)
	document.getElementById("output").innerHTML = `
		<ul>
		<li><strong>이름 :</strong>${clo.name}</li>
		<li><strong>나이 :</strong>${clo.age}</li>
		<li><strong>메시지 :</strong>${clo.hellMsg("임성우")}</li>
		</ul>
	`;
}//onload
</script>
</head>
<body>
<div id = "wrap" >
	<div id="header">header 1200(w)x150(h) 
				사이트로고, 주력 서비스, navigation bar
	</div>
	<div id="container">
	<div id ="output">
		
	</div>
	</div>
	<div id="footer">footer 1200(w)x150(h)</div>
</div>

</body>
