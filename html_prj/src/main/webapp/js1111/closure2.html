<script type="text/javascript">
function test(){
	 var name="민병조";
	 
	 function addr(){
		   return "서울시 강남구 역삼동.";
	 }
//	 alert("dsalkjfkj");
	return {na: name , ad : addr}; //closure을 return한다.
}

//closure를 만들면서 호출하면 저장할 수 있도록 anonymous function 작성해야 한다.
//test2는 closure이다.
var test2 = function(){
	 var name="민병조";
	 
	 function addr(){
		   return "서울시 강남구 역삼동.";
	 }
//	 alert("dsalkjfkj");
	return {na: name , ad : addr}; //closure을 return한다.
}();
var test3 = function(paramName){
	 var name=paramName;
	 
	 function age(paramAge){
		 var result = "성인";
		   if(paramAge <20){
			 result = "미성년자."   
		   }//end if
		   return result;
	 }
//	 alert("dsalkjfkj");
	return {na: name , age : age}; //closure을 return한다.
}("임성우");

function useClosure(){
	//함수를 호출하면 반환되는 closure을 받아야한다.
	/* 
	var clo =test();
	alert(clo.na);
	alert(clo.ad());
	*/
	alert(test().na);
	alert(test().ad());
}
function useClosure2(){
	//test2는 자신 함수를 호출한뒤 리턴되는 closure를 저장했기 때문에 ()없이 함수 내부의 
	//변수(na) 함수 ad()를 사용할 수 있게 된다.
	alert(test2.na);
	alert(test2.ad());
}
function useClosure3(){
	//test2는 자신 함수를 호출한뒤 리턴되는 closure를 저장했기 때문에 ()없이 함수 내부의 
	//변수(na) 함수 ad()를 사용할 수 있게 된다.
	alert(test3.na);
	alert(test3.age(20));
}
</script>

		<input type="button" value="클릭" class="btn btn-success" onclick="useClosure()"/>
		<input type="button" value="클릭2" class="btn btn-primary" onclick="useClosure2()"/>
		<input type="button" value="클릭3" class="btn btn-primary" onclick="useClosure3()"/>

</div>
