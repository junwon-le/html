<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<style type="text/css">
#aDiv , #bDiv { color : #FF0000 }
.oclass, .uclass{background-color: #FEF6E1}
/* .oclass{background-color: #FEF6E1} */

[type = 'text'],[type = 'password'],[type = 'button'] {font-size : 20px}

th, td{background-color: #519E52}
</style>
</head>
<body>
<div id="aDiv">미세먼지 가득한 화창한 수요일</div>
<div id="bDiv">내일은 목요일</div>
<ul class ="uclass">
<li>짜장면</li>
<li>순대국밥</li>
<li>햄버거</li>
</ul>
<hr>
<ol class="oclass">
<li>짜장면</li>
<li>순대국밥</li>
<li>햄버거</li>
</ol>
<input type="text" name="name" placeholder = "이름 입력"/><br>
<input type="password" name="pass" placeholder = "비밀번호 입력"/><br>
<input type="button" value="입력" /><br>

<table>
<tr>
<th>번호</th><th>이름</th><th>나이</th>
</tr>
<tr>
<td>1</td><td>민병조</td><td>25</td>
<td>2</td><td>김서우</td><td>26</td>
</tr>
</table>
</body>
</html>
