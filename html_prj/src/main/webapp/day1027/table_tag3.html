<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>복잡한 모양의 테이블</title>
</head>
<body>
<strong>칸 합치기</strong>
<!-- 시작하는 td에서 colspan="합칠 칸의 수" 뒤에 td를 삭제 -->
<table border ="1"   height="300">
<tr>
	<td colspan ="2" width = "200">1</td><!-- <td>2</td> --><td width = "100" >3</td>
</tr>
<tr>
	<td width = "100">4</td><td colspan="2" width = "200">5</td><!-- <td>6</td> -->
</tr>
<tr>
	<td colspan = "3" width = "300">7</td><!-- <td>8</td><td>9</td> -->
</tr>
</table>
<hr>
<strong>행 합치기</strong>
<!-- 시작하는 td에서 rowspan="합칠행의수" 아래 td를 삭제 -->
<table border ="1" width = "300" >
<tr>
	<td rowspan ="2" height="200">1</td><td height="100">2</td><td rowspan="3" height="300">3</td>
</tr>
<tr>
	<!-- <td>4</td> --><td rowspan="2" height="200">5</td><!-- <td>6</td> -->
</tr>
<tr>
	<td height="100">7</td><!-- <td>8</td> --><!-- <td>9</td> -->
</tr>
</table>

</table>
<hr>
<strong>행 합치기</strong>
<!-- 시작하는 td에서 rowspan="합칠행의수" 아래 td를 삭제 -->
<table border ="1" width = "300" height="300" >
<tr>
	<td rowspan="2" bgcolor="#FFCCCC">1</td><td colspan="2" bgcolor="#CC99CC">2</td><!-- <td >3</td> -->
</tr>
<tr>
	<<!-- td>4</td> --><td  bgcolor="#9999CC" >5</td><td rowspan="2" bgcolor="#99CCCC">6</td>
</tr>
<tr>
	<td colspan="2" bgcolor="#666699">7</td><!-- <td>8</td> --><!-- <td>9</td> -->
</tr>
</table>
</body>
</html>
