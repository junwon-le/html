<script type="text/javascript">
//1. 배열 생성
//빈배열
var arr = new Array();
//초기화된 배열
var arr2 = [2025,"안녕",2025.11,false];

arr[1] = "가변 길이형";

//3. 값 얻기
document.write(arr[0]+"<br>");
//backtick
document.write(`${arr[0]} <br>`);

	document.write(`<li>${i}번째 방 : ${arr[i]} </li>`);

	document.write(`<li>${i}번째 방 : ${arr[i]} </li>`);
}

// 배열 방의 검색

var ind = arr.indexOf("잘가");//존재 하지 않으면 -1 반환
	var msg="존재함";
