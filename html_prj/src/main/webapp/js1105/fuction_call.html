<!DOCTYPE html>
<html>
<head>
<link rel="shortcut icon"	href="http://192.168.10.73/html_prj/common/images/favicon.ico">
<meta charset="UTF-8">
<title>Insert title here</title>
<!-- bootstrap CDN 시작 -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<!-- bootstrap CDN 끝 -->
<style type="text/css">
</style>
<script type="text/javascript">
	function call(evt_attr){
	 alert(`${evt_attr} 함수 호출`);	
	}
</script>
</head>
<body>
<!-- <body onload="call('HTML 로딩될때')"> -->
	<!-- <div onload="call('HTML 로딩될때')"></div> --><!-- onload는 body에서만 작성 -->
	<input type="button" value="클릭" onclick ="call('클릭했을 때')"
	class="btn btn-success btn-sm"/>
	<input type="button" value="더블클릭" ondblclick ="call('클릭했을 때')"
	class="btn btn-success btn-sm"/>
	<br>
	<img src="../common/images/google.png" onclick="call('이미지 클릭 시')" />
	<table class="table table-hover">
	<tr>
		<td onclick="call('클릭 시')" >EditPlus</td>
	</tr>
	</table>
	
	
	<div style="width:400px">
	<div class="mb-3">
  	<label for="exampleFormControlInput1" class="form-label">Email address</label>
  	<input type="email" onkeydown="call('눌릴 시')" class="form-control" id="exampleFormControlInput1" placeholder="name@example.com" >
	</div>
	<div class="mb-3">
  	<label for="exampleFormControlTextarea1" class="form-label">Example textarea</label>
  	<textarea class="form-control" onkeyup = "call('키가 올라 올 때')" id="exampleFormControlTextarea1" rows="3"
    ></textarea>
    <br>
	</div>
	</div>
	<label>마우스가 올라가면</label>	
    <img src="../common/images/google.png" onmouseover="call('마우스가 올라갔을  시')" /><br>
	<label>마우스가 올라가면</label>	
    <img src="../common/images/google.png" onmouseout="call(' 마우스가 나갔을 시')" /><br>
	<label>이전에 선택한 옵션과 다른 옵션이 선택</label>
	<select onchange ="call('다른 옵션 선택 시')" >
	<option>a</option>
	<option>b</option>
	<option>c</option>
	</select>	
	<br>
	<label>커서가 들어갔을 때의 값과 커서가 빠져 나갔을 때의 값이 다른때</label>


	<input type="text" onchange = "call('커서 전 후 값이 변경 시')" />
	<br>
	<label>커서가 빠져 나갔을 때</label>
	<input type="text" onblur = "call('커서가 빠져 나갔을 때')" />
    
    
</body>
</html>
