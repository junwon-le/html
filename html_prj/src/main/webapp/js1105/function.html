<script type="text/javascript">
//사용자 정의 함수
//기명함수
function weekMsg(){ 
	var msg = "오늘은 수요일 입니다.";
	alert(msg);
}//end msg

weekMsg();

function msg2(name){
	return `${name}님 안녕하세요`;
}
var msg= msg2("민병조");
document.write( msg );
//무기명함수
// JavaScript의 함수는 first class function 이여서 함수가 값으로 취급된다.
// 변수에 할당 가능, 매개변수로 할당 가능.
var msg3 = function(){
	var today = "2025-11-25";
	alert(`오늘은 ${today} 입니다.`)
}
// alert(msg); //first class function 함수의 내용이 그대로 출력
msg3(); // ()를 붙이면 함수가 동작을 한다.

function useFunc(func){
	func(); //매개 변수로 함수명을 받아서 해당 함수를 호출할 수 있다
}
useFunc(msg3); // 무기명 함수
useFunc(weekMsg); // 기명 함수

</script>
