<!DOCTYPE html>
<html>
<head>
<link rel="shortcut icon"	href="http://192.168.10.73/html_prj/common/images/favicon.ico">
<meta charset="UTF-8">
<title>Insert title here</title>
<!-- bootstrap CDN 시작 -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<!-- bootstrap CDN 끝 -->
<style type="text/css">
#output{border : 1px solid #333; width : 600px ; height : 400px; overflow: auto}
</style>
<script type="text/javascript">
//길이는 length keyword
function useStr(){
	var msg = "오늘은 수요일 입니다.";
	var output = `<strong>${msg}</strong><br>의 글자수 ${msg.length}자<br>`;
 	msg="민병조";
 	output+=`${msg}은/는 ${msg === "민병조"}<br>`
 	
 	msg = "JavaScript는 C언어로 S들어진 S언어"	;
 	output+= `${msg}를<br> 모두 대문자 ${msg.toUpperCase() }<br>`
 	output+= `${msg}를<br> 모두 소문자 ${msg.toLowerCase() }<br>`
 	output+= `${msg}에서 대문자 S의 인덱스 ${msg.indexOf("S") }<br>`
 	output+= `${msg}에서 소문자 s의 인덱스 ${msg.indexOf("s") }<br>`//찾는 문자가 없다면 -1
 	output+= `${msg}에서 소문자 a의 인덱스 ${msg.indexOf("a") }<br>`
 	output+= `${msg}에서 소문자 a의 인덱스 ${msg.lastIndexOf ("a") }<br>` //뒤에서 찾기
 	output+= `${msg}에서 두번째 S에 인덱스 ${msg.indexOf ('S',msg.indexOf("S")+1) }<br>` //뒤에서 찾기
 	output+= `${msg}에서 4~9 사이에 하위 문자열 ${msg.substring(4,10) }<br>` //뒤에서 찾기
 	msg="   에어컨 나온다    ";
 	output +=`"${msg}" 앞뒤 공백 제거 "${msg.trim()}" <br>`;
 	msg="JavaScript"
 	output += `${msg}는 Java로 시작되었는가 ? ${msg.startsWith('Java')}<br>`;
 	output += `${msg}는 java로 시작되었는가 ? ${msg.startsWith('fava')}<br>`;
 	output += `${msg}는 pt로 끝났는가? ${msg.endsWith('pt')}<br>`;
 	
 	var msg2 = msg.concat("는 객체 기반 언어!!");
 	output += `${msg2}<br>`
 	
 	output+= `${msg}에서 4번째 인덱스의 문자 ${msg.charAt(4)}<br>`
 	
 	var arr="이것이, 자바다, HTML5, 웹프로그래밍, 입문".split(",");
 	arr.push("저것은 자반가?");
 	var ul="<ul class='list-group' >";
 	var active="";
 	for(var i=0;i<arr.length;i++){
 		if(i==3){
 			active = " active";
 			
 		}
 		ul+= `<li class="list-group-item ${active}" aria-current="true">${arr[i]}</li>`;
 		active="";
 	}//end for
 	ul+="</ul>"
 	output+=ul;
 	
 	msg= msg.replaceAll("Java","Type");
 	output+=msg;
 	document.getElementById("output").innerHTML=output;
}
</script>
</head>
<body>
<div id = "wrap" >
	<div id="header">
	</div>
	<div id="container">
	<input type="button" value="문자열 함수" class="btn btn-success btn-sm"
	    onclick="useStr()"/>
	<div id="output">
		
	</div>
	</div>
	<div id="footer">footer 1200(w)x150(h)</div>
</div>

</body>
