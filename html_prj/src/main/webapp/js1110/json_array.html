<html>
<head>

<!-- bootstrap CDN 끝 -->
<style type="text/css">
#wrap{ margin : 0px auto ; width : 1200px; height : 1000px;
      /* background-color: #ff0000 */ }
#header{ height : 150px;  /* background-color: #4179C2 */ }
#container{ height : 700px;  /* background-color: #71b75e ; */ }
#footer{ height : 150px;  /* background-color: #fef6e1 ; */ }

</style>
<script type="text/javascript">
window.onload=function(){
	//1. JSONArray 생성 : [ { 이름 : 값 ,,,,},{ 이름 : 값 ,,,},{ 이름 : 값 ,,,}]
	var jsonArr = [
		{name : "민병조", email : "min@test.com"},
		{name : "신승덕", email : "shin@test.com"},
		{email : "woo@google.com",name : "임성우"},
		{name : "이정우", email : "lee@daum.com"},
		{name : "이지원", email : "lee2@nate.com"},
		];
	// 값을 추가
	jsonTemp = {name : "하지예" , email:"ha@google.com" };
	jsonArr.push(jsonTemp);
	
	//2. 반복
	var jsonObj ; // JSONArray에 있는 JSONObject을 저장하기위한 변수
	var output = `<table class ='table table-hover'>
					<thead>
					<tr>
					<th style='width : 100px'> 번호 </th>
					<th style='width : 150px'> 이름 </th>
					<th style='width : 300px'> 이메일 </th>
					</tr>
					</thead>
					<tbody>
					`;
	for( var i =0; i< jsonArr.length ; i++){
		jsonObj = jsonArr[i];
		//3.반복중인 방의 값을 parsing하여 보여준다.
		output+=`
				<tr>
				<td>${i+1}</td>
				<td>${jsonObj.name}</td>
				<td>${jsonObj.email}</td>
				</tr>
				`;
		
		
	}//end for
	
	output+= `</tbody>
			</table>`;
					
	document.getElementById("output").innerHTML = output;					
}	
</script>
</head>
<body>
<div id = "wrap" >
	<div id="header">header 1200(w)x150(h) 
				사이트로고, 주력 서비스, navigation bar
	</div>
	<div id="container">
	<div id="output">
		
	</div>
	</div>
	<div id="footer">footer 1200(w)x150(h)</div>
</div>

</body>
