<!DOCTYPE html>
<html>
<head>
<link rel="shortcut icon"	href="http://192.168.10.73/html_prj/common/images/favicon.ico">
<meta charset="UTF-8">
<title>Insert title here</title>
<!-- 내가 만든 CSS -->
<!-- <link rel="stylesheet" type = "text/css" href="http://192.168.10.73/html_prj/common/css/mian_ver251031.css"/> -->

<!-- bootstrap CDN 시작 -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<!-- bootstrap CDN 끝 -->
<style type="text/css">
#wrap{ margin : 0px auto ; width : 1200px; height : 1000px;
      /* background-color: #ff0000 */ }
#header{ height : 150px;  /* background-color: #4179C2 */ }
#container{ height : 700px;  /* background-color: #71b75e ; */ }
#footer{ height : 150px;  /* background-color: #fef6e1 ; */ }


</style>
<script type="text/javascript">
let divNode;
let divNode2;
var jsonInfo= {};

window.onload=function(){
	document.getElementById("btnStrJSON").addEventListener("click",strJSON);
	document.getElementById("btnJSONObj").addEventListener("click",useJSONObj);
	
	divNode = document.getElementById("output");
	
	
	
	document.getElementById("btnInput").addEventListener("click",input);
	document.getElementById("btnOutput").addEventListener("click",print);
	
	
	divNode2 = document.getElementById("output2");
}//onload

function strJSON(){
	//1. 문자열" 로 JSONObject 형태를 생성
	var txt = "{name : '탄지로' , age : 20 , flag : true , func : function(){return '물의 호흡'; } }"
	//alert(txt);
	//2. eval 함수로 jsonobject 생성
	var jsonObj = eval("("+txt+")");
	//alert(jsonObj); // string - > JSONObject
	
	//JSONObject 값 추가 : 객체명.이름 = 값;
	jsonObj.today="2025-11-10";
	
	//JSONObject 값 삭제 : delete 객체명.이름;
	delete jsonObj.name;
	//3. parsing
	output = `
			<ul>
				<li>이름 : ${jsonObj.name}</li>
				<li>이름 : ${jsonObj.age}</li>
				<li>이름 : ${jsonObj.flag}</li>
				<li>이름 : ${jsonObj.func()}</li>
				<li>이름 : ${jsonObj.today}</li>
			</ul>
			`;
			
	//4. div 에 설정
	divNode.innerHTML = output;
}

function useJSONObj(){
	//2. jsonobject 생성
	var jsonObj = {name : '젠이츠' , age : 19 , flag : true , func : function(){return '번개의 호흡'; }};
	alert(jsonObj); // JSONObject
	
	//JSONObject 값 추가 : 객체명.이름 = 값;
	jsonObj.today="2025-11-10";
	
	//JSONObject 값 삭제 : delete 객체명.이름;
	delete jsonObj.name;
	//3. parsing
	output = `
			<ul>
				<li>이름 : ${jsonObj.name}</li>
				<li>이름 : ${jsonObj.age}</li>
				<li>이름 : ${jsonObj.flag}</li>
				<li>이름 : ${jsonObj.func()}</li>
				<li>이름 : ${jsonObj.today}</li>
			</ul>
			`;
			
	//4. div 에 설정
	divNode.innerHTML = output;
}


function input(){
	jsonInfo = {name : 'sadf', age : 1};
	let obj = document.frm;
	
	if(jsonInfo.name == ""){
			
		output = `<span style="color:red;" >이름은 필수 입력</span>`;
		divNode2.innerHTML = output;
		return;
	}
	if(jsonInfo.age == ""){
		
		output = `<span style="color:red">나이는 필수 입력</span>`;
		divNode2.innerHTML = output;
		return;
	}
	
	jsonInfo.name = obj.name2.value;
	jsonInfo.age = obj.age2.value;

}
function print(){
	
	var name=jsonInfo.name;
	var age=jsonInfo.age;
	
	if( name != undefined && age != undefined){
		divNode2.innerHTML=`<marquee scrollamount='20' behavior=alternate>${ name }님 ${ age }살 </marquee>`;
	}else{
		alert("JSONObject에 데이터가 존재하지 않습니다.\n데이터를 추가해주세요.");
	}//end if
	
}
</script>
</head>
<body>
<div id = "wrap" >
	<div id="header">header 1200(w)x150(h) 
				사이트로고, 주력 서비스, navigation bar
	</div>
	<div id="container">
	<div>
		<input type="button" value="string JSONObject 사용" class="btn btn-success" id="btnStrJSON"/>
		<input type="button" value="JSONObject 객체 사용" class="btn btn-primary" id="btnJSONObj"/>
	</div>
	<div id="output">
	</div>

	<hr>
	<form name="frm">
	<div>
		<label>이름 : </label><input type="text" name =" name2" id="name2" /><br>
		<label>나이 : </label><input type="text" name = "age2" id="age2" /><br>
		<input type="button" value="입력" class="btn btn-success" id="btnInput"/>
		<input type="button" value="출력" class="btn btn-danger" id="btnOutput"/>
	</div>	
	<div id="output2">
	</div>
	</form>
	
	
	</div>
	<div id="footer">footer 1200(w)x150(h)</div>
</div>

</body>
</html>
