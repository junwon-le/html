<!DOCTYPE html>
<html>
<head>
<link rel="shortcut icon"	href="http://192.168.10.73/html_prj/common/images/favicon.ico">
<meta charset="UTF-8">
<title>Insert title here</title>
<!-- bootstrap CDN 시작 -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<!-- bootstrap CDN 끝 -->
<style type="text/css">
#wrap{ margin : 0px auto ; width : 1200px; height : 1000px;
      /* background-color: #ff0000 */ }
#header{ height : 150px;  /* background-color: #4179C2 */ }
#container{ height : 700px;  /* background-color: #71b75e ; */ }
#footer{ height : 150px;  /* background-color: #fef6e1 ; */ }
</style>

<script type="text/javascript">
//1. 스토리지 얻기
let ss = window.sessionStorage;
let divNode;
let obj;

window.onload=function(){
	document.getElementById("btnSetItem").addEventListener("click",setItem);
	document.getElementById("btnGetItem").addEventListener("click",getItem);
	document.getElementById("btnRemoveItem").addEventListener("click",removeItem);
	divNode = document.getElementById("output");
	obj = document.frm;
	}//onload

function setItem(){
	//2. 아이템 설정
//	ss.setItem("name","민병조");
//	ss.setItem("age",26);
//	ss.setItem("flag",true);
	
	ss.setItem("name",obj.name.value);
	ss.setItem("age",obj.age.value);
	ss.setItem("flag",obj.flag.value);
	
	divNode.innerHTML= "세션 스토리지에 값(아이템) 저장";  // DOM : document object model
}//setItem
function getItem(){
	//storage에 저장된 값을 얻어와서 HTML Form Control에 설정
	//아이템의 값 얻기
	var name = ss.getItem("name");
	var age = ss.getItem("age");
	var flag = ss.getItem("flag");
	if(name == null){
		alert("값 부터 입력해주세요.");
		return;
	}
	
	// HTML Form Control에 값 설정
	obj.name.value = name;
	obj.age.value = age;
	//obj.flag.value = flag;
	for(var i =0; i< obj.flag.length ; i++){
	 if(obj.flag[i].value == flag){
		 obj.flag[i].selected=true;
		 break;
	 }	
	}
	//출력용 DIV에 얻은 값을 출력
	divNode.innerHTML = `<ul>
							<li>이름 : ${name}</li>
							<li>나이 : ${age}</li>
							<li>플래그 : ${flag}</li>
						</ul>`;
	
}//getItem
function removeItem(){
	ss.removeItem("name");
	ss.clear();
}//removeItem
</script>
</head>
<body> <!-- body에는 텍스트를 바로 넣지 않는다.  -->
<div id = "wrap" >
	<div id="header">header 1200(w)x150(h) 
				사이트로고, 주력 서비스, navigation bar
	</div>
	<div id="container">
	<form name="frm">
	<div>
	<label>이름 </label> <input type="text" name="name" id="name" ><br>
	<label>나이 </label> <input type="text" name="age" id="age" ><br>
	<label>플래그 </label> <select name="flag" id="flag" >
						<option value="ture">true</option>		
						<option value="false">false</option>		
						</select><br>
	
	</div>
	<div>
		<input type="button" value="sessionStorage 저장" class="btn btn-success" id="btnSetItem"/>
		<input type="button" value="sessionStorage 값얻기" class="btn btn-primary" id="btnGetItem"/>
		<input type="button" value="sessionStorage 값삭제" class="btn btn-danger" id="btnRemoveItem"/>
	</div>
	<div id="output"></div>
	</form>
	</div>
	<div id="footer">footer 1200(w)x150(h)</div>
</div>

</body>
</html>
