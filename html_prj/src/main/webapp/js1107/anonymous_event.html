<!DOCTYPE html>
<html>
<head>
<link rel="shortcut icon"	href="http://192.168.10.73/html_prj/common/images/favicon.ico">
<meta charset="UTF-8">
<title>Insert title here</title>
<!-- bootstrap CDN 시작 -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<!-- bootstrap CDN 끝 -->
<style type="text/css">
#wrap{ margin : 0px auto ; width : 1200px; height : 1000px;
      /* background-color: #ff0000 */ }
#header{ height : 150px;  /* background-color: #4179C2 */ }
#container{ height : 700px;  /* background-color: #71b75e ; */ }
#footer{ height : 150px;  /* background-color: #fef6e1 ; */ }
</style>
<!-- script을 외부 파일 방식으로 연결 -->
<!-- <script type="text/javascript" src="event.js"> -->
<script type="text/javascript">
window.onload=function(){
	//function setEvt(){ //기명함수
	alert(document.getElementById("btn"));
	//무기명 함수로 이벤트를 등록
	//1. 태그를 찾고 2.이벤트를 등록 3.이벤트 발생 시 사용자에게 제공할 코드를 익명 함수로 작성
	document.getElementById("btn").onclick=function(){
		alert("버튼이 클릭 되었습니다.");
	}//onclik
	
	document.getElementById("img").onmouseover=function(){
		document.getElementById("img").src = "../js1106/images/tiger.png";
	}//onmouseover
	document.getElementById("img").onmouseout=function(){
		document.getElementById("img").src = "../js1106/images/dog.png";
	}//onmouseover

	}//setEvt  , window.onload
</script>
</head>
<body>
<!-- <body onload="setEvt()"> -->   <!-- inline 방식 이벤트 등록 : HTML과 JS가 합쳐짐 -->
<div id = "wrap" >
	<div id="header">
	</div>
	<div id="container">
	<div>
		<input type="button" id="btn" class = "btn btn-success" value="클릭"/>
		<br>
		<img src="../js1106/images/dog.png" id="img"/>		
	</div>
	</div>
	<div id="footer">
	</div>
</div>

</body>
</html>
