<head>

<!-- bootstrap CDN 시작 -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<!-- bootstrap CDN 끝 -->
<style type="text/css">
#wrap{ margin : 0px auto ; width : 1200px; height : 1000px;
      /* background-color: #ff0000 */ }
#header{ height : 150px;  /* background-color: #4179C2 */ }
#container{ height : 700px;  /* background-color: #71b75e ; */ }
#footer{ height : 150px;  /* background-color: #fef6e1 ; */ }
</style>
<script type="text/javascript">
window.onload=function(){
	//이벤트를 리스너에 등록
	//1. 태그를 찾고, 2.이벤트 리스너에 이벤트를 선택하여 등록.
	document.getElementById("btn").addEventListener("click",evtProcess);
	document.getElementById("txt").addEventListener("keydown",evtProcess);
	document.getElementById("sel").addEventListener("change",evtProcess);
		
}//onload

//이벤트 등록과 이벤트 처리를 분리할 수 있다. 
function evtProcess( evt ){
	document.getElementById("output").innerHTML =
		`오늘은 금요일 입니다.<br> 발생이벤트 : ${evt}`;
		
}//btnClick

</script>
</head>
<body>
<div id = "wrap" >
	<div id="header">header 1200(w)x150(h) 
				사이트로고, 주력 서비스, navigation bar
	</div>
	<div id="container">
	<div>
		<input type="button" value="클릭" class="btn btn-success" id="btn" />
		<input type="text" value="클릭"  id="txt" />
		<select id="sel" >
		<option value="Java">Java</option>
		<option value="Oracle">Oracle</option>
		<option value="Javascript">Javascript</option>
		</select>
		<div id="output"></div>
	</div>
	</div>
	<div id="footer">footer 1200(w)x150(h)</div>
</div>

</body>
</html>
