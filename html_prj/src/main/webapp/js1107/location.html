<html>
<head>

<meta charset="UTF-8">
<title>Insert title here</title>
<!-- bootstrap CDN 시작 -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<!-- bootstrap CDN 끝 -->
<style type="text/css">

</style>
<script type="text/javascript">
window.onload=function(){
	//이벤트 등록
	//1.태그를 찾고 > 2.이벤트 리스너에 등록
	document.getElementById("btn").addEventListener("click",goSite);
}//onload

function goSite(){
	//select의 값을 얻기 
	var selNode = document.getElementById("url");
	
	//confirm(selNode.value+" / "+selNode.selectedIndex);
	if( selNode.selectedIndex != 0 ){
		if(confirm(selNode.value+"로 이동 하시겠습니까?")){
			//location 객체를 사용한 이동. href => history가 남는다.
			//location.href="http://"+selNode.value;
			//replcae 는 페이지 치환 history 남지 않는다.
			location.replace("http://"+selNode.value);
		}	
	}
}//goSite

</script>
</head>
<body>
<div id = "wrap" >
	<div id="header">header 1200(w)x150(h) 
				사이트로고, 주력 서비스, navigation bar
	</div>
	<div id="container">
	<div>
		<label>이동할 사이트 선택</label>
		<select id="url">
		<option value="N/A">선택</option>
		<option value="naver.com">네이버</option>
		<option value="google.com">구글</option>
		<option value="youtube.com">유튜브</option>
		<option value="java.sun.com">자바</option>
		</select>
		<input type="button" value="이동" class="btn btn-success" id="btn"/>
	</div>
	</div>
	<div id="footer">footer 1200(w)x150(h)</div>
</div>

</body>
</html>
