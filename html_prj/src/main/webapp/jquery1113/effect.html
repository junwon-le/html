<!-- bootstrap CDN 시작 -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<!-- bootstrap CDN 끝 -->
<style type="text/css">
#wrap{ margin : 0px auto ; width : 1200px; height : 1000px;
      /* background-color: #ff0000 */ }
#header{ height : 150px;  /* background-color: #4179C2 */ }
#container{ height : 700px;  /* background-color: #71b75e ; */ }
#footer{ height : 150px;  /* background-color: #fef6e1 ; */ }

#img{ display : none ; }
#idWarn{color : #ff0000; display: none;}
</style>
<!-- jQuery DNS 시작 -->
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<script type="text/javascript">
$(function(){
	$("#btnHide").click(hide);
	$("#btnShow").click(show);
	$("#btnToggle").click(toggle);
	
	$("#btnFadeIn").click(fadeIn);
	$("#btnFadeOut").click(fadeOut);
	$("#btnFadeToggle").click(fadeToggle);
	
	$("#btnslideDown").click(slideDown);
	$("#btnslideUp").click(slideUp);
	$("#btnslideToggle").click(slideToggle);
	
	$("#btnInput").click(idWarn);
});//ready

function hide(){
	$("#img").hide();
}//hide

function show(){
	$("#img").show();
	
}//show

function toggle(){
	$("#img").toggle();

}//toggle

function fadeIn(){
	$("#img").fadeIn(1000);
}//fadeIn
	
function fadeOut(){
	$("#img").fadeOut(1000,function(){
		$("#img").prop("src","../day1024/images/test.png");
		$("#img").show();

	});
}//fadeOut

function fadeToggle(){
	$("#img").fadeToggle(1000);
	
}//fadeToggle

function slideUp(){
	$("#imgDiv").slideUp(1000);
}//slideUp
	
function slideDown(){
	$("#imgDiv").slideDown(1000);
}//slideDown

function slideToggle(){
	$("#img").slideToggle(1000);
}//slideToggle

function idWarn(){
	var id = $("#id").val();
	if(id.replace(/ /g,"")==""){
		//$("#idWarn").fadeIn(700).fadeOut(700).fadeIn(700).fadeOut(700).fadeIn(700).fadeOut(700).fadeIn(700).fadeOut(700).fadeIn(1000,function(){
		//$("idWarn").css("font-size","50px")}).fadeOut(400);
		for(var i=0;i<5;i++){
			$("#idWarn").fadeIn(400).fadeOut(400);
		}//end for
	}
	
}//idWarn

</script>
</head>
<body>
<div id = "wrap" >
	<div id="header">header 1200(w)x150(h) 
				사이트로고, 주력 서비스, navigation bar
	</div>
	<div id="container">
	<div>
		<div style="height : 320px " id="imgDiv">
			<img src="../common/images/james.png" id="img"/>
		</div>
		<input type="button" value="숨기기" class="btn btn-primary" id="btnHide"/>
		<input type="button" value="보이기" class="btn btn-danger" id="btnShow"/>
		<input type="button" value="보이기/숨기기" class="btn btn-success" id="btnToggle"/>
		<br>
		<input type="button" value="서서히 숨기기" class="btn btn-primary" id="btnFadeOut"/>
		<input type="button" value="서서히 보이기" class="btn btn-danger" id="btnFadeIn"/>
		<input type="button" value="서서히 보이기/숨기기" class="btn btn-success" id="btnFadeToggle"/>
		<br>
		<input type="button" value="말아올리기" class="btn btn-primary" id="btnslideUp"/>
		<input type="button" value="펼쳐보이기" class="btn btn-danger" id="btnslideDown"/>
		<input type="button" value="말아/펼쳐" class="btn btn-success" id="btnslideToggle"/>
		
	</div>
		<div style="height : 80px">
		<input type="text" id="id" placeholder="아이디">
		<div id="idWarn">아이디는 필수 입력!!!</div>
		</div>	
		<input type="button" value="입력" class="btn btn-success" id="btnInput"/>
	</div>
	<div id="footer">footer 1200(w)x150(h)</div>
</div>

</body>
</html>
