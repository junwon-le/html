<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>목록</title>
</head>
<body>
<!-- li는 <ol>, <ul>에 하위 태그로 정의 해야한다. -->

<!-- <li>리 스트에 들어갈 항목1</li>
<li>리스트에 들어갈 항목2</li>
10+24 --> 

<strong>순서 목록</strong>
<ol type="1">
	<li>사과</li><!--type속성에는 1,a,A,i,I  -->
	<li>딸기</li>
	<li value="100">배</li>
	<li>포도</li>
	<li>귤</li>
</ol>

<ul type="square">
	<li>자바</li>
	<li>Oracle DBMS</li>
	<li>JDBC</li>
	<li>HTML</li>
	<li>CSS</li>
</ul>

<dl>
	<dt>자바</dt>
	<dd>완벽한 OOP언어,WORA</dd>
	<dt>오라클</dt>
	<dd>대용량 데이털를 다룰 때 사용하는 DBMS </dd>
	<dt>JDBC</dt>
	<dd>Java에서 DBMS와 연동하기 위해 지원하는 저수준 API</dd>
</dl>

</body>
</html>
