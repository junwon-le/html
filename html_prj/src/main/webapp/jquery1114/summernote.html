<!-- bootstrap CDN 시작 -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<!-- bootstrap CDN 끝 -->
<style type="text/css">
#wrap{ margin : 0px auto ; width : 1200px; height : 1000px;
      /* background-color: #ff0000 */ }
#header{ height : 150px;  /* background-color: #4179C2 */ }
#container{ height : 700px;  /* background-color: #71b75e ; */ }
#footer{ height : 150px;  /* background-color: #fef6e1 ; */ }
</style>
<!-- jQuery CDN 시작 -->
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<!-- summernote -->
<script type="text/javascript" src="http://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
<!-- include summernote css/js-->
<link href="https://cdn.jsdelivr.net/npm/summernote@0.9.0/dist/summernote-lite.min.css" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/summernote@0.9.0/dist/summernote-lite.min.js"></script>
<script type="text/javascript">
	$(function(){
      $('#summernote').summernote({
        placeholder: '아무말 대잔치!!',
        tabsize: 2,
        height: 300,
        width: 300,
        toolbar: [
            // [groupName, [list of button]]
            ['style', ['bold', 'italic', 'clear']],
            ['fontsize', ['fontsize']],
            ['color', ['color']],
            ['para', ['ul', 'ol', 'paragraph']],
            ['insert', ['link', 'picture']]
            ]
      });		
	})
</script>

<script type="text/javascript">
$(function(){
 $("#btn").click(function(){
	 $("#frm").submit(); //Form Control들의 값이 back-end로 전송
 });
});//ready


</script>
</head>
<body>
<div id = "wrap" >
	<div id="header">header 1200(w)x150(h) 
				사이트로고, 주력 서비스, navigation bar
	</div>
	<div id="container">
	<div>
	<!-- summernote안에 입력된 데이터를 back-end로 전송하기 위해서는 method가 반드시 POST되어야 한다. -->
		<!--  <form method="GET" action="test.jsp" id="frm">-->  <!-- GET방식은 256 이상 보낼 수 없는데 이미지는 encoding된 값이 256을 넘어가서 POST로 넘겨야한다. -->
		<form method="GET" action="test.jsp" id="frm">
			<textarea style="width : 500px ; height: 100px" name="intro" id="summernote">
			
			</textarea>
			<br>
			<input type="button" value="전송" class="btn btn-success" id="btn"/>
		</form>
	</div>
	</div>
	<div id="footer">footer 1200(w)x150(h)</div>
</div>

</body>
</html>
