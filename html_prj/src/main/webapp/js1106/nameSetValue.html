<script type="text/javascript">
function getNameValue(){
	//text, password, hidden, textarea, select은 .value로 얻는다. 
	var obj = window.document.joinFrm;
	
	var output="";
	
	output += `text : <strong>${obj.id.value}, ${obj.email.value}, ${obj.domain.value}</strong><br>`;
	output += `password : <strong>${obj.pass.value}</strong><br>`;
	output += `date : <strong>${obj.birth.value}</strong><br>`;
	output += `loc : <strong>${obj.loc.value}</strong><br>`;
	output += `hidden : <strong>${obj.code.value}</strong><br>`;
	output += `file : <strong>${obj.upfile.value}</strong><br>`;
	output += `textarea : <strong>${obj.intro.value.replaceAll("\n","<br>")}</strong><br>`;
	
	//name 속성이 같은 값을 가진 객체 처리 -> 배열로 처리
	var hobby = obj.hobby;
	var checkedValue = "";
	for ( var i = 0 ; i<hobby.length;i++){
		//alert(hobby[i].checked +" / "+hobby[i].value);
		//확인 상태의 체크박스 값을 checkedValue에 할당
		if(hobby[i].checked){
			checkedValue += hobby[i].value+" ";
			
		}
	}
	
	output += `select : <strong>${checkedValue}</strong><br>`;
	
	
	
	var gender = obj.gender;
	var genderValue = "";
	
	//라디오 버튼이 확인 상태인가?
 	for(var i =0; i<gender.length;i++){
		if(gender[i].checked){
			genderValue = gender[i].value;
		}
	} 
	
	if(genderValue==""){
		alert("성별 필수 입력");
		return;
	}
	
	output += `radio : <strong>${genderValue}</strong><br>`;
	
	//select의 선택된 값 얻기
	//select은 option이 배열로 들어간다. 
	var locArr = obj.loc;
	var selLoc = "";
	for(var i=0;i<locArr.length;i++){
		if(locArr[i].selected){
		 selLoc = locArr[i].value;
		}
			
	}
	output+= `select Array : <strong> ${selLoc}</strong><br>`
	
	//지역 : 경기도 2번
	obj.loc[2].selected= true;
	
	document.getElementById("output").innerHTML = output;
	
}
</script>
