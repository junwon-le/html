<style type="text/css">
</style>
<script type="text/javascript">
	function setTime(){
		
		var date = new Date();
		let output=	`${date.getFullYear()}년 ${date.getMonth()+1}월 ${date.getDate()}일`;
		output += ` ${date.getHours()}시 ${date.getMinutes()}분 ${date.getSeconds()}초`;
		
		document.getElementById("date").value = output;
		
		//useSetTimeout();
		setTimeout(setTime,100); // 1초마다 한번씩 입력된 함수가 호출  : F.C.F (재귀 호출이 가능)
	}

</script>

<body>
<div id = "wrap" >
	<div id="header">header 1200(w)x150(h) 
				사이트로고, 주력 서비스, navigation bar
	</div>
	<div id="container">
	<div>
		<label>시간</label>
		<input type="text" name="date" id="date" style="width : 300px"/>
		<button class="btn btn-success btn-sm" onclick="setTime()">클릭</button>
	</div>
	</div>
	<div id="footer">footer 1200(w)x150(h)</div>
</div>

</body>
