#output{border : 1px solid #333 ; width :300px ; height :100px;}

<!-- jQuery DNS 시작 -->
<script src="https://ajax.googleapis.com/ajax/libs/jquery/2.2.4/jquery.min.js"></script>
<script type="text/javascript">
$(document).ready(function(){
	$("#output").css("background-color","#0000ff")  //같은 아이디가 두개이면 안된다 아이디는 항상 하나만 사용함!!!
	 //class selector
	$(".input").css("background-color","#00ff00")
	//tag selectot
	$("span").css("background-color","#c3e9ff")
	//multiple selector
	$("td,th").css("background-color","#c3e9ff")
	//attribute selector
	$("[value='클릭']").css("background-color","#3673c4")
	//sub selector
	$("p>span").css("background-color","#9e9e9e")
	//behabvior selector : 지원 하지 않는다. 
	$("a").mouseenter(function(){
		$("a").css("color","#ff0000");
	})
	
});//ready - body가 로딩되는 타이밍에 맞추려고
</script>
